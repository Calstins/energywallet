<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon from logo.svg -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>EnergyWallet — Smart Finance for Nigeria</title>
    <meta
      name="description"
      content="EnergyWallet is Nigeria's high-performance digital wallet. Manage your money, pay bills, buy airtime and data, and access a verified vendor marketplace — all in one app."
    />
    <meta
      name="keywords"
      content="EnergyWallet, Nigerian fintech, digital wallet Nigeria, pay bills Nigeria, airtime data purchase, NDIC insured wallet, smart finance Nigeria"
    />
    <meta name="author" content="EnergyWallet" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://energywallet.com.ng" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://energywallet.com.ng" />
    <meta
      property="og:title"
      content="EnergyWallet — Smart Finance for Nigeria"
    />
    <meta
      property="og:description"
      content="Master your financial life with a high-performance wallet, direct vendor marketplace, and elite billing tools. Kinetic energy for your capital."
    />
    <meta property="og:image" content="https://energywallet.ng/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:site_name" content="EnergyWallet" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@energywallet" />
    <meta
      name="twitter:title"
      content="EnergyWallet — Smart Finance for Nigeria"
    />
    <meta
      name="twitter:description"
      content="Master your financial life with a high-performance wallet, direct vendor marketplace, and elite billing tools. Kinetic energy for your capital."
    />
    <meta
      name="twitter:image"
      content="https://energywallet.com.ng/og-image.png"
    />

    <!-- Theme color (browser tab / mobile chrome bar) -->
    <meta name="theme-color" content="#EB5E00" />
    <meta name="msapplication-TileColor" content="#EB5E00" />

    <!-- Preconnect for Google Fonts (already used in CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data — Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EnergyWallet",
        "url": "https://energywallet.ng",
        "logo": "https://energywallet.ng/logo.svg",
        "description": "Nigeria's high-performance digital wallet for payments, bills, and marketplace transactions.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@energywallet.ng",
          "availableLanguage": "English"
        },
        "sameAs": [
          "https://twitter.com/energywallet",
          "https://instagram.com/energywallet"
        ]
      }
    </script>

    <!-- Structured Data — Mobile App -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "EnergyWallet",
        "operatingSystem": "Android, iOS",
        "applicationCategory": "FinanceApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NGN"
        },
        "description": "Smart wallet app for Nigeria — pay bills, buy data, manage budgets, and shop from verified vendors.",
        "url": "https://energywallet.ng"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
